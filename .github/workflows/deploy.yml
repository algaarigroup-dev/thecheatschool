name: Build and deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless browser for page prerendering
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Build React/Vite website
        run: npm run build

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          local_path: "./dist/*"
          remote_path: "domains/thecheatschool.in/public_html/"
          sftp_only: true
          delete_remote_files: false

      # "./dist/*" skips hidden files, so upload the routing rules explicitly.
      - name: Deploy .htaccess routing rules
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          local_path: "./dist/.htaccess"
          remote_path: "domains/thecheatschool.in/public_html/"
          sftp_only: true
          delete_remote_files: false

      - name: Notify Bing and other engines that pages changed (IndexNow)
        run: node scripts/indexnow.mjs
        continue-on-error: true
